<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f172a, #1e293b, #312e81);
        color: white;
    }

    .container {
        width: 90%;
        max-width: 500px;
        padding: 40px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(10px);
    }

    h1 {
        font-size: 42px;
        letter-spacing: 8px;
        margin-bottom: 30px;
        color: #c4b5fd;
    }

    ul {
        list-style: none;
    }

    li {
        padding: 15px;
        margin: 10px 0;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        transition: 0.3s;
    }

    li:hover {
        transform: translateY(-3px);
        background: rgba(196, 181, 253, 0.2);
    }
</style>
